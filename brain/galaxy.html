const canvas = document.getElementById("sky");
const ctx = canvas.getContext("2d");
const tip = document.getElementById("tip");
const dpr = Math.min(window.devicePixelRatio || 1, 2);
let W, H, cam = { x: 0, y: 0, z: 0.62 };
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

function resize() {
  W = innerWidth; H = innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
}

// static background starfield
const dust = [];
{ let rng = 1; const rand = () => (rng = (rng * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 380; i++) dust.push({
    x: (rand() - .5) * 2600, y: (rand() - .5) * 2600,
    r: rand() * 1.1 + .2, a: rand() * .5 + .1, ph: rand() * 6.28 });
}
NODES.forEach((n, i) => { n.ph = (i * 0.618) % 6.28; n.r = 2.2 + n.w * 2.2; });

let dimCluster = null, query = "";
function visible(n) {
  if (dimCluster !== null && n.cl !== dimCluster) return .13;
  if (query) {
    const hay = (n.t + " " + n.k).toLowerCase();
    return hay.includes(query) ? 1 : .08;
  }
  return 1;
}

function draw(t) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const grad = ctx.createRadialGradient(W/2, H/2, 80, W/2, H/2, Math.max(W,H)*.75);
  grad.addColorStop(0, "#0c1028"); grad.addColorStop(.55, "#080b1d"); grad.addColorStop(1, "#05070f");
  ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);

  const sx = x => (x - cam.x) * cam.z + W/2;
  const sy = y => (y - cam.y) * cam.z + H/2;

  // dust
  for (const d of dust) {
    const a = d.a * (reduced ? 1 : (0.7 + 0.3 * Math.sin(t/1400 + d.ph)));
    ctx.globalAlpha = a * .8;
    ctx.fillStyle = "#aab4e8";
    ctx.beginPath(); ctx.arc(sx(d.x), sy(d.y), d.r, 0, 6.28); ctx.fill();
  }

  // constellation lines
  ctx.globalAlpha = 1; ctx.lineWidth = Math.max(.5, .8 * cam.z);
  for (const [a, b] of EDGES) {
    const na = NODES[a], nb = NODES[b];
    const va = visible(na), vb = visible(nb);
    ctx.globalAlpha = 0.16 * Math.min(va, vb);
    ctx.strokeStyle = CLUSTERS[na.cl].color;
    ctx.beginPath(); ctx.moveTo(sx(na.x), sy(na.y)); ctx.lineTo(sx(nb.x), sy(nb.y)); ctx.stroke();
  }

  // stars
  for (const n of NODES) {
    const x = sx(n.x), y = sy(n.y);
    if (x < -40 || x > W + 40 || y < -40 || y > H + 40) continue;
    const v = visible(n);
    const tw = reduced ? 1 : (0.82 + 0.18 * Math.sin(t/900 + n.ph));
    const r = n.r * cam.z * tw;
    const color = CLUSTERS[n.cl].color;
    ctx.globalAlpha = 0.33 * v;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r * 4.4);
    g.addColorStop(0, color); g.addColorStop(1, "transparent");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r * 4.4, 0, 6.28); ctx.fill();
    ctx.globalAlpha = v;
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(x, y, Math.max(r, 1.1), 0, 6.28); ctx.fill();
    ctx.globalAlpha = v * .9; ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(x, y, Math.max(r * .38, .5), 0, 6.28); ctx.fill();
  }

  // cluster labels (fade in when zoomed out-ish)
  if (cam.z < 1.6) {
    ctx.globalAlpha = Math.min(1, (1.7 - cam.z)) * .8;
    ctx.font = "600 12px -apple-system, 'Segoe UI', sans-serif";
    ctx.textAlign = "center";
    for (const c of CLUSTERS) {
      ctx.fillStyle = c.color;
      ctx.fillText(c.name.toUpperCase(), sx(c.cx), sy(c.cy) - (58 + Math.sqrt(c.n) * 9) * cam.z);
    }
  }
  ctx.globalAlpha = 1;
}
let raf;
function loop(t) { draw(t); raf = requestAnimationFrame(loop); }

// --- interaction ---
let drag = null;
canvas.addEventListener("mousedown", e => { drag = { x: e.clientX, y: e.clientY }; canvas.classList.add("dragging"); });
addEventListener("mousemove", e => {
  if (drag) {
    cam.x -= (e.clientX - drag.x) / cam.z; cam.y -= (e.clientY - drag.y) / cam.z;
    drag = { x: e.clientX, y: e.clientY };
    if (reduced) draw(0);
  } else hover(e);
});
addEventListener("mouseup", () => { drag = null; canvas.classList.remove("dragging"); });
canvas.addEventListener("wheel", e => {
  e.preventDefault();
  const f = e.deltaY < 0 ? 1.13 : 0.885;
  const mx = (e.clientX - W/2) / cam.z + cam.x, my = (e.clientY - H/2) / cam.z + cam.y;
  cam.z = Math.min(4.5, Math.max(0.18, cam.z * f));
  cam.x = mx - (e.clientX - W/2) / cam.z; cam.y = my - (e.clientY - H/2) / cam.z;
  if (reduced) draw(0);
}, { passive: false });

function nodeAt(cx, cy) {
  const wx = (cx - W/2) / cam.z + cam.x, wy = (cy - H/2) / cam.z + cam.y;
  let best = null, bd = 13 / cam.z;
  for (const n of NODES) {
    const d = Math.hypot(n.x - wx, n.y - wy);
    if (d < bd && visible(n) > .5) { bd = d; best = n; }
  }
  return best;
}
function hover(e) {
  const n = nodeAt(e.clientX, e.clientY);
  if (n) {

    tip.style.left = Math.min(e.clientX + 14, W - 310) + "px";
    tip.style.top = (e.clientY + 14) + "px";
    tip.innerHTML = "<div></div><div class='kind'></div>";
    tip.children[0].textContent = n.t;
    tip.children[1].textContent = CLUSTERS[n.cl].name + " · " + n.k + (n.link ? " · click to open" : "");
    canvas.style.cursor = "pointer";

    tip.style.display = "none";
