<style>
  :root {
    --paper: #faf7f0; --paper-2: #f3efe6; --card: #ffffff;
    --ink: #2a2620; --muted: #8a8378; --faint: #b3ab9e;
    --line: #ece6da; --line-2: #e0d9ca;
    --accent: #3e7be8; --accent-ink: #2c5fbf; --accent-soft: #edf2fd;
    --tag-ink: #a8703a;
    --shadow: 0 1px 2px rgba(80,64,40,.05), 0 4px 14px rgba(80,64,40,.05);
    --shadow-lift: 0 6px 16px rgba(80,64,40,.10), 0 14px 40px rgba(80,64,40,.10);
    --serif: "Palatino Linotype", Palatino, "Iowan Old Style", Georgia, serif;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; padding: 0 24px 72px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--ink); min-height: 100vh;
    background:
      radial-gradient(1200px 420px at 80% -140px, #fdf6ea 0%, rgba(253,246,234,0) 70%),
      var(--paper);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }

  /* ---- header ---- */
  header { padding: 34px 0 20px; }
  .brandrow { display: flex; align-items: center; gap: 15px; }
  .feather { flex-shrink: 0; filter: drop-shadow(0 3px 8px rgba(120,80,40,.14)); }
  .wordmark { font-family: var(--serif); font-size: 33px; line-height: 1; letter-spacing: -.01em; }
  .kicker { font-size: 11px; font-weight: 700; letter-spacing: .24em; text-transform: uppercase;
            color: var(--faint); margin-left: 12px; align-self: flex-end; padding-bottom: 4px; }
  .rule { height: 1px; margin: 16px 0 0; background: var(--line-2); position: relative; }
  .rule::after { content: ""; position: absolute; left: 0; top: -1px; height: 3px; width: 64px;
    border-radius: 3px; background: linear-gradient(90deg,#3ec9a7,#3e7be8,#8a5be0,#ef7a48); }
  .tagline { margin: 13px 2px 0; color: var(--muted); font-size: 14.5px; }
  .tagline b { color: var(--ink); font-weight: 600; }

  /* ---- controls ---- */
  .controls { position: sticky; top: 0; z-index: 5; padding: 16px 0 12px;
    background: linear-gradient(var(--paper) 72%, rgba(250,247,240,0));
    margin-bottom: 6px; }
  .searchwrap { position: relative; }
  .searchwrap svg { position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
    width: 17px; height: 17px; stroke: var(--faint); pointer-events: none; }
  input[type="search"] {
    width: 100%; padding: 13px 16px 13px 42px; font-size: 15px; font-family: inherit;
    background: var(--card); border: 1px solid var(--line-2); border-radius: 13px; color: var(--ink);
    box-shadow: var(--shadow); transition: border-color .15s, box-shadow .15s;
  }
  input[type="search"]::placeholder { color: var(--faint); }
  input[type="search"]:focus { outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft); }
  .tagbar { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
  .tag {
    font-size: 12px; padding: 5px 13px; border-radius: 99px; cursor: pointer;
    background: var(--card); border: 1px solid var(--line-2); color: #6f675b;
    user-select: none; transition: all .13s; white-space: nowrap;
  }
  .tag:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
  .tag.active { background: var(--accent); color: #fff; border-color: var(--accent);
    font-weight: 650; box-shadow: 0 3px 10px rgba(62,123,232,.28); }
  .count { color: var(--faint); font-size: 12.5px; margin-left: auto; font-variant-numeric: tabular-nums;
    align-self: center; white-space: nowrap; }

  /* ---- grid + cards ---- */
  .grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fill, minmax(248px, 1fr)); }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    overflow: hidden; display: flex; flex-direction: column;
    box-shadow: var(--shadow); transition: transform .16s ease, box-shadow .16s ease, border-color .16s;
  }
  .card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lift); border-color: var(--line-2); }
  .thumbwrap { position: relative; aspect-ratio: 16/10; background: var(--paper-2); display: block; overflow: hidden; }
  .thumbwrap img { width: 100%; height: 100%; object-fit: cover; display: block;
    transition: transform .4s ease; }
  .card:hover .thumbwrap img { transform: scale(1.045); }
  .thumbwrap .ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #c9bfae;
    background: repeating-linear-gradient(135deg, #f5f0e6 0 12px, #f1ebe0 12px 24px); }
  .thumbwrap .ph svg { width: 34px; height: 34px; }
  .type { position: absolute; top: 10px; left: 10px; font-size: 10px; font-weight: 700;
    padding: 3px 9px; border-radius: 99px; background: rgba(255,255,255,.94); color: #6f675b;
    text-transform: uppercase; letter-spacing: .06em; box-shadow: 0 1px 4px rgba(80,64,40,.14);
    backdrop-filter: blur(4px); }
  .body { padding: 13px 15px 15px; display: flex; flex-direction: column; gap: 7px; flex: 1; }
  .title { font-size: 14.5px; font-weight: 640; line-height: 1.32; color: var(--ink);
    text-decoration: none; letter-spacing: -.005em;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .title:hover { color: var(--accent); }
  .desc { font-size: 12.5px; color: var(--muted); line-height: 1.5; display: -webkit-box;
    -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .cardtags { font-size: 11px; color: var(--tag-ink); line-height: 1.4;
    display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
  .meta { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--line);
    font-size: 11px; color: var(--faint); display: flex; justify-content: space-between;
    align-items: center; gap: 8px; }
  .meta .site { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .links a { color: var(--accent); text-decoration: none; font-weight: 600; white-space: nowrap; }
  .links a:hover { text-decoration: underline; }

  /* ---- empty ---- */
  .empty { text-align: center; color: var(--muted); padding: 90px 20px; display: none; }
  .empty .feather { margin: 0 auto 18px; opacity: .55; }
  .empty h2 { font-family: var(--serif); font-weight: 500; font-size: 21px; margin: 0 0 6px; color: var(--ink); }
  .empty p { margin: 0; font-size: 14px; }

  footer { text-align: center; color: var(--faint); font-size: 12px; margin-top: 46px;
    padding-top: 22px; border-top: 1px solid var(--line); }
  footer b { color: var(--muted); font-weight: 600; }
  @media (max-width: 560px) { body { padding: 0 16px 60px; } .wordmark { font-size: 27px; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } html { scroll-behavior: auto; } }
</style>

    el.classList.toggle("active", el.textContent === activeTag));
  let shown = 0;
  [...ITEMS].sort((a,b) => (b.clippedAt||"").localeCompare(a.clippedAt||"")).forEach(it => {
    const hay = [it.title, it.description, it.note, it.site, (it.tags||[]).join(" ")].join(" ").toLowerCase();
    if (q && !hay.includes(q)) return;
    if (activeTag && !(it.tags||[]).includes(activeTag)) return;
    shown++;
    const card = document.createElement("div");
    card.className = "card";
    const thumb = it.thumbLocal || it.thumbnail;
    card.innerHTML = `
      <a class="thumbwrap" href="${it.url || "#"}" target="_blank" rel="noopener">
        ${thumb ? `<img loading="lazy" src="${thumb}" onerror="this.remove()">` : ""}
        <div class="ph">${TYPE_ICON[it.type] || TYPE_ICON.clip}</div>
        <span class="type">${it.type || "clip"}</span>
      </a>
      <div class="body">
        <a class="title" href="${it.url || "#"}" target="_blank" rel="noopener"></a>
        <div class="desc"></div>
        <div class="cardtags">${(it.tags||[]).filter(t=>t!=="magpie").map(t=>"#"+t).join("  ")}</div>
        <div class="meta">
          <span class="site">${(it.site||"")} · ${(it.clippedAt||"").slice(0,10)}</span>
          <span class="links">${it.file ? `<a href="${obsidianLink(it.file)}">Open in Obsidian ↗</a>` : ""}</span>
        </div>
      </div>`;
    if (thumb) card.querySelector(".ph").style.display = "none";
    card.querySelector(".title").textContent = it.title || it.url || "Untitled";
    card.querySelector(".desc").textContent = it.note || it.description || "";
    grid.appendChild(card);
  });
  document.getElementById("count").textContent = shown === ITEMS.length
    ? shown + " clips" : shown + " of " + ITEMS.length;
  document.getElementById("empty").style.display = shown ? "none" : "block";
  document.getElementById("grid").style.display = shown ? "grid" : "none";
}
document.getElementById("tagline-count").textContent = ITEMS.length + " clips";
document.getElementById("searchbox").addEventListener("input", render);
render();
</script>
</body>
</html>
