<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Magpie Private Library</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233e7be8' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M20.2 4.8a6.3 6.3 0 0 0-8.9 0L5 11v7h7l6.2-6.3a6.3 6.3 0 0 0 0-8.9z'/%3E%3Cpath d='M17 8 4 21'/%3E%3Cpath d='M15.5 13.5H9'/%3E%3C/svg%3E">
  <style>
    :root {
      --paper: #faf7f0;
      --paper-2: #f3efe6;
      --card: #fff;
      --ink: #2a2620;
      --muted: #8a8378;
      --faint: #b3ab9e;
      --line: #e0d9ca;
      --accent: #3e7be8;
      --accent-soft: #edf2fd;
      --green: #2c9b70;
      --red: #b54a45;
      --serif: "Palatino Linotype", Palatino, "Iowan Old Style", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(760px 360px at 72% 2%, #fdf1df 0%, transparent 72%),
        radial-gradient(620px 340px at 14% 96%, #eef4fd 0%, transparent 72%),
        var(--paper);
    }
    main {
      width: min(100%, 440px);
      padding: 34px;
      background: rgba(255,255,255,.94);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: 0 18px 60px rgba(80,64,40,.12);
    }
    .brand { display: flex; align-items: center; gap: 13px; }
    .wordmark { font: 33px/1 var(--serif); }
    .private {
      margin-left: auto;
      padding: 5px 10px;
      border: 1px solid #dfe9dc;
      border-radius: 99px;
      color: var(--green);
      background: #f4faf6;
      font-size: 10px;
      font-weight: 750;
      letter-spacing: .09em;
      text-transform: uppercase;
    }
    .rule {
      height: 3px;
      width: 72px;
      margin: 17px 0 24px;
      border-radius: 3px;
      background: linear-gradient(90deg,#3ec9a7,#3e7be8,#8a5be0,#ef7a48);
    }
    h1 { margin: 0; font: 500 27px/1.15 var(--serif); }
    p { margin: 10px 0 24px; color: var(--muted); font-size: 14px; line-height: 1.55; }
    label {
      display: block;
      margin-bottom: 8px;
      color: #6f675b;
      font-size: 12px;
      font-weight: 700;
    }
    input {
      width: 100%;
      min-height: 48px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--ink);
      background: var(--card);
      font: inherit;
    }
    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    button {
      width: 100%;
      min-height: 48px;
      margin-top: 12px;
      border: 0;
      border-radius: 12px;
      color: white;
      background: var(--accent);
      font: 700 14px/1 inherit;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(62,123,232,.22);
    }
    button:hover { background: #316dd8; }
    button:disabled { cursor: wait; opacity: .7; }
    .message { min-height: 21px; margin: 12px 2px 0; color: var(--red); font-size: 13px; }
    .back { display: block; margin-top: 20px; color: var(--muted); font-size: 12px; text-align: center; }
    .back:hover { color: var(--accent); }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }
    @media (max-width: 480px) {
      main { padding: 28px 22px; border-radius: 20px; }
      .wordmark { font-size: 29px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <svg width="45" height="45" viewBox="0 0 120 120" aria-hidden="true">
        <defs>
          <linearGradient id="a" x1="20%" y1="90%" x2="80%" y2="10%">
            <stop offset="0%" stop-color="#e8654f"/><stop offset="22%" stop-color="#8a5be0"/>
            <stop offset="48%" stop-color="#3e7be8"/><stop offset="75%" stop-color="#3ec9a7"/>
            <stop offset="100%" stop-color="#2fae94"/>
          </linearGradient>
          <linearGradient id="b" x1="0%" y1="100%" x2="60%" y2="0%">
            <stop offset="0%" stop-color="#f2913d"/><stop offset="60%" stop-color="#ef7a48"/>
            <stop offset="100%" stop-color="#f5a552"/>
          </linearGradient>
        </defs>
        <g transform="rotate(36 60 60)">
          <path fill="url(#b)" d="M60 8 C76 24 84 44 82 64 C81 80 72 96 60 104 L60 8 Z"/>
          <path fill="url(#a)" d="M60 8 C44 24 36 44 38 64 C39 80 48 96 60 104 L60 8 Z"/>
          <g stroke="#faf7f0" stroke-width="3.4" stroke-linecap="round" fill="none">
            <path d="M42 38 Q52 42 59 41"/><path d="M39 54 Q51 58 59 56"/>
            <path d="M40 70 Q51 74 59 71"/><path d="M46 86 Q54 88 59 85"/>
            <path d="M78 30 Q68 35 61 34"/><path d="M81 46 Q69 51 61 49"/>
            <path d="M80 62 Q69 66 61 64"/><path d="M74 79 Q66 81 61 78"/>
          </g>
          <path fill="none" stroke="#315c79" stroke-width="2.6" stroke-linecap="round"
            d="M60 10 C60 40 60 70 58 88 C57 98 54 108 48 116"/>
        </g>
      </svg>
      <span class="wordmark">Magpie</span>
      <span class="private">Private</span>
    </div>
    <div class="rule"></div>
    <h1>Your full library, wherever you are.</h1>
    <p>Enter your Magpie password to open your saved pages, previews, Markdown notes, and transcripts.</p>
    <form id="loginform">
      <label class="sr-only" for="username">Username</label>
      <input class="sr-only" id="username" name="username" value="kellylucas" autocomplete="username">
      <label for="password">Magpie password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button id="submit" type="submit">Open my library</button>
      <div class="message" id="message" role="alert" aria-live="polite"></div>
    </form>
    <a class="back" href="/">Back to kellylucas.dev</a>
  </main>
  <script>
    const form = document.getElementById("loginform");
    const button = document.getElementById("submit");
    const message = document.getElementById("message");
    const params = new URLSearchParams(location.search);
    const requested = params.get("returnTo") || "/brain/gallery.html";
    const returnTo = requested.startsWith("/brain/") ? requested : "/brain/gallery.html";

    fetch("/api/magpie-session", { credentials: "same-origin", cache: "no-store" })
      .then((response) => response.json())
      .then((state) => {
        if (state.authenticated) location.replace(returnTo);
      })
      .catch(() => {});

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.textContent = "";
      button.disabled = true;
      button.textContent = "Opening…";
      try {
        const response = await fetch("/api/magpie-login", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            password: document.getElementById("password").value,
          }),
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Could not sign in.");
        location.replace(returnTo);
      } catch (error) {
        message.textContent = error.message;
        button.disabled = false;
        button.textContent = "Open my library";
        document.getElementById("password").select();
      }
    });
  </script>
</body>
</html>
