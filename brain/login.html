  <main class="door">
    <div class="door__art" aria-hidden="true">
      <svg class="shape door__sun spin" viewBox="-100 -100 200 200"><use x="-100" y="-100" width="200" height="200" href="#s-sun"/></svg>
      <svg class="shape door__o1" viewBox="-100 -100 200 200"><use x="-100" y="-100" width="200" height="200" href="#s-ast"/></svg>
      <svg class="shape door__o2" viewBox="-100 -100 200 200"><use x="-100" y="-100" width="200" height="200" href="#s-quat"/></svg>
      <img src="/assets/art/magpie-drawer.webp" width="1200" height="1326" alt="" decoding="async" />
    </div>
    <div class="door__card">
      <div class="door__brand">
        <svg class="feather" id="brandIcon" viewBox="0 0 120 120" aria-hidden="true"><g transform="rotate(36 60 60)"><path fill="var(--coral)" d="M60 8 C76 24 84 44 82 64 C81 80 72 96 60 104 L60 8 Z"/><path fill="var(--teal)" d="M60 8 C44 24 36 44 38 64 C39 80 48 96 60 104 L60 8 Z"/><g stroke="var(--paper)" stroke-width="3.4" stroke-linecap="round" fill="none"><path d="M42 38 Q52 42 59 41"/><path d="M39 54 Q51 58 59 56"/><path d="M40 70 Q51 74 59 71"/><path d="M46 86 Q54 88 59 85"/><path d="M78 30 Q68 35 61 34"/><path d="M81 46 Q69 51 61 49"/><path d="M80 62 Q69 66 61 64"/><path d="M74 79 Q66 81 61 78"/></g><path fill="none" stroke="var(--navy)" stroke-width="3" stroke-linecap="round" d="M60 10 C60 40 60 70 58 88 C57 98 54 108 48 116"/></g></svg>
        <span class="wordmark" id="wordmark">Magpie</span>
        <span class="status"><span class="dot dot-priv"></span>Private</span>
      </div>
      <h1 id="headline">My library, wherever I am.</h1>
      <p id="subline">The magpie has the key. Type the password to open every saved page, preview, note and transcript.</p>
      <form class="door__form" id="loginform">
        <label class="sr-only" for="username">Username</label>
        <input class="sr-only" id="username" name="username" value="kellylucas" autocomplete="username" tabindex="-1">
        <label for="password" id="passwordLabel">Magpie password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
        <button class="btn" id="submit" type="submit">Open my library</button>
        <div class="door__msg" id="message" role="alert" aria-live="polite"></div>
      </form>
      <a class="door__back" href="/">Back to kellylucas.dev</a>
    </div>
  </main>
  <script>
    const form = document.getElementById("loginform");
    const button = document.getElementById("submit");
    const message = document.getElementById("message");
    const params = new URLSearchParams(location.search);
    // One password guards the whole private wing; the door dresses for where
    // you are headed. agentcommons.kellylucas.dev is the room's front door.
    const roomBound = location.hostname.startsWith("agentcommons.") ||
      (params.get("returnTo") || "").includes("room.html");
    const fallback = roomBound ? "/brain/room.html" : "/brain/gallery.html";
    const requested = params.get("returnTo") || fallback;
    const returnTo = requested.startsWith("/brain/") ? requested : fallback;
    let buttonIdle = "Open my library";
    if (roomBound) {
      buttonIdle = "Open the desk";
      document.documentElement.classList.add("room-door");
      document.title = "Agent Commons";
      document.getElementById("wordmark").textContent = "Agent Commons";
      document.getElementById("headline").textContent = "Your team desk, wherever you are.";
      document.getElementById("subline").textContent =
        "Same password as the rest of kellylucas.dev. Sign in once and you're at the table with Codex, Claude Code, Kip, and Vellum.";
      document.getElementById("passwordLabel").textContent = "Password";
      document.getElementById("submit").textContent = buttonIdle;
      document.getElementById("brandIcon").outerHTML =
        `<svg width="45" height="45" viewBox="0 0 48 48" aria-hidden="true"><defs><clipPath id="acLoginClip"><path transform="translate(9.5 9.5) scale(0.66)" d="M22 1A21 21 0 0 1 43 22 21 21 0 0 1 22 43H5a4 4 0 0 1-4-4V22A21 21 0 0 1 22 1z"/></clipPath></defs><circle cx="24" cy="24" r="23" fill="#f7f7f7"/><g transform="rotate(-8 24 24)" clip-path="url(#acLoginClip)"><rect x="2" y="2" width="44" height="44" fill="#ffffff"/><g transform="rotate(24 24 24)"><rect x="4" y="-8" width="6.6" height="64" fill="#367496"/><rect x="12.2" y="-8" width="6.6" height="64" fill="#258360"/><rect x="20.4" y="-8" width="6.6" height="64" fill="#8e4605"/><rect x="28.6" y="-8" width="6.6" height="64" fill="#652085"/><rect x="36.8" y="-8" width="6.6" height="64" fill="#a12661"/></g></g></svg>`;
    }

    fetch("/api/magpie-session", { credentials: "same-origin", cache: "no-store" })
      .then((response) => response.json())
      .then((state) => {
        if (state.authenticated) location.replace(returnTo);
      })
      .catch(() => {});

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.textContent = "";
      button.disabled = true;
      button.textContent = "Opening…";
      try {
        const response = await fetch("/api/magpie-login", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            password: document.getElementById("password").value,
          }),
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Could not sign in.");
        location.replace(returnTo);
      } catch (error) {
        message.textContent = error.message;
        button.disabled = false;
        button.textContent = buttonIdle;
        document.getElementById("password").select();
      }
    });
  </script>
