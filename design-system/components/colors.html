<!-- @dsCard group="Colors" name="Lab palette" subtitle="Warm ground, soft pastels, deep ink" width="720" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Colors · Kelly's Lab</title>
<style>
  body { margin: 0; padding: 28px; background: #f4f2ec; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: #14201a; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  .swatch { border: 1px solid rgba(20, 32, 26, 0.14); border-radius: 14px; overflow: hidden; background: #fff; }
  .swatch__chip { height: 64px; }
  .swatch__meta { padding: 10px 12px; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; display: flex; flex-direction: column; gap: 3px; }
  .swatch__hex { color: #6c766f; text-transform: none; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div class="grid">
  <div class="swatch"><div class="swatch__chip" style="background:#f4f2ec"></div><div class="swatch__meta"><span>page bg</span><span class="swatch__hex">#f4f2ec</span></div></div>
  <div class="swatch"><div class="swatch__chip" style="background:#e4f1fb"></div><div class="swatch__meta"><span>sky</span><span class="swatch__hex">#e4f1fb</span></div></div>
  <div class="swatch"><div class="swatch__chip" style="background:linear-gradient(0deg,#e4f1fb,#eaf6ec)"></div><div class="swatch__meta"><span>mint slab gradient</span><span class="swatch__hex">#e4f1fb to #eaf6ec</span></div></div>
  <div class="swatch"><div class="swatch__chip" style="background:#cfe9d3"></div><div class="swatch__meta"><span>mint</span><span class="swatch__hex">#cfe9d3</span></div></div>
  <div class="swatch"><div class="swatch__chip" style="background:#a9d3b0"></div><div class="swatch__meta"><span>mint deep</span><span class="swatch__hex">#a9d3b0</span></div></div>
  <div class="swatch"><div class="swatch__chip" style="background:#f6f3e8"></div><div class="swatch__meta"><span>cream</span><span class="swatch__hex">#f6f3e8</span></div></div>
  <div class="swatch"><div class="swatch__chip" style="background:#e4e4f3"></div><div class="swatch__meta"><span>lilac (in progress)</span><span class="swatch__hex">#e4e4f3</span></div></div>
  <div class="swatch"><div class="swatch__chip" style="background:#f8ece5"></div><div class="swatch__meta"><span>blush</span><span class="swatch__hex">#f8ece5</span></div></div>
  <div class="swatch"><div class="swatch__chip" style="background:#14201a"></div><div class="swatch__meta"><span>ink</span><span class="swatch__hex">#14201a</span></div></div>
  <div class="swatch"><div class="swatch__chip" style="background:#3b4842"></div><div class="swatch__meta"><span>ink soft</span><span class="swatch__hex">#3b4842</span></div></div>
  <div class="swatch"><div class="swatch__chip" style="background:#6c766f"></div><div class="swatch__meta"><span>ink mute</span><span class="swatch__hex">#6c766f</span></div></div>
  <div class="swatch"><div class="swatch__chip" style="background:#c9e6c9"></div><div class="swatch__meta"><span>footer ink (on dark)</span><span class="swatch__hex">#c9e6c9</span></div></div>
</div>
</body>
</html>
