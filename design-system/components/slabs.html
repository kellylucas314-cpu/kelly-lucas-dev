<!-- @dsCard group="Surfaces" name="Color slabs" subtitle="Rounded pastel blocks with dot tags" width="720" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Slabs · Kelly's Lab</title>
<style>
  @font-face { font-family: "GC Protage"; src: url("../fonts/GCPROTAGE-ExtraLight.woff2") format("woff2"); font-weight: 200; font-display: swap; }
  body { margin: 0; padding: 24px; background: #f4f2ec; color: #14201a; display: flex; flex-direction: column; gap: 12px; font-family: "Neutiva", sans-serif; }
  .block { position: relative; border-radius: 28px; border: 1px solid rgba(20, 32, 26, 0.14); padding: 40px 32px 28px; min-height: 90px; }
  .block--mint { background: linear-gradient(0deg, #e4f1fb 0%, #eaf6ec 100%); }
  .block--hero {
    background:
      linear-gradient(0deg, rgba(20,32,26,0.04) 1px, transparent 1px) 0 0 / 100% 56px,
      linear-gradient(90deg, rgba(20,32,26,0.04) 1px, transparent 1px) 0 0 / 56px 100%,
      linear-gradient(0deg, #e4f1fb 0%, #eaf6ec 100%);
  }
  .block--cream { background: #f6f3e8; }
  .block--lilac { background: #e4e4f3; }
  .block--blush { background: linear-gradient(0deg, #f8ece5 0%, #faf2ec 100%); }
  .block--ink { background: #14201a; color: #cfe9d3; }
  .dot-tag { position: absolute; top: 20px; right: 24px; display: inline-flex; align-items: center; gap: 8px; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; }
  .dot-tag::before { content: ""; width: 7px; height: 7px; border-radius: 1px; background: currentColor; }
  .name { font-family: "GC Protage", sans-serif; font-weight: 200; font-size: 30px; margin: 0; }
</style>
</head>
<body>
<div class="block block--hero"><span class="dot-tag">hero</span><p class="name">Mint gradient, graph paper</p></div>
<div class="block block--cream"><span class="dot-tag">cream</span><p class="name">Warm sections</p></div>
<div class="block block--lilac"><span class="dot-tag">experiments</span><p class="name">Lilac means in progress</p></div>
<div class="block block--blush"><span class="dot-tag">a thought</span><p class="name">Blush for the quote</p></div>
<div class="block block--ink"><span class="dot-tag">footer</span><p class="name">Deep ink ground</p></div>
</body>
</html>
